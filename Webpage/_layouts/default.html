
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description"
        content="{{ page.description | default: site.description }}">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.7;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    a { color: #0969da; }
    img { max-width: 100%; height: auto; }
    footer {
      margin-top: 60px;
      border-top: 1px solid #ddd;
      padding-top: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
    <a href="{{ '/support/' | relative_url }}">Support</a>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    &copy; {{ site.time | date: "%Y" }} Alex Nadzharov
  </footer>
</body>
</html>
