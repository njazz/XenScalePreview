# XcodeGen spec: one Xcode project with the app and Quick Look extension for iOS and macOS.
# The project is generated next to Package.swift, so "." is the package and all paths are relative to the repo root.
# Generate it with ./gen_project.sh (reads BUNDLE_ID, VERSION, BUILD and TEAM_ID from the environment).
# The iOS and macOS apps share a bundle ID, so they can ship as one universal App Store purchase.
name: XenScalePreview
options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
    macOS: "12.0"
packages:
  XenScalePreview:
    path: .           # the Swift package (SclCore) in this folder, next to the generated project
settings:
  base:
    MARKETING_VERSION: ${VERSION}
    CURRENT_PROJECT_VERSION: ${BUILD}
    DEVELOPMENT_TEAM: ${TEAM_ID}
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    PRODUCT_NAME: $(TARGET_NAME)
targets:
  # MARK: iOS
  XenScalePreview-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Localization/App          # <lang>.lproj/Localizable.strings: host app wording
      - path: Icon/Assets.xcassets
      - path: Bundle/PrivacyInfo.xcprivacy
    dependencies:
      - target: XenScalePreviewExtension-iOS
      - package: XenScalePreview
        product: SclCore
    settings:
      base:
        PRODUCT_NAME: XenScalePreview
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        INFOPLIST_FILE: Bundle/iOS-App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  XenScalePreviewExtension-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/XenScalePreviewExtension
        excludes: ["main.swift"]   # main.swift is the SwiftPM stand-in for NSExtensionMain
      - path: Bundle/PrivacyInfo.xcprivacy
    dependencies:
      - package: XenScalePreview
        product: SclCore
    settings:
      base:
        PRODUCT_NAME: XenScalePreviewExtension
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.quicklook
        INFOPLIST_FILE: Bundle/Extension-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
  # MARK: macOS
  XenScalePreview-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/XenScalePreview
      - path: Localization/App
      - path: Icon/Assets.xcassets
      - path: Bundle/PrivacyInfo.xcprivacy
    dependencies:
      - target: XenScalePreviewExtension-macOS
    settings:
      base:
        PRODUCT_NAME: XenScalePreview
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        INFOPLIST_FILE: Bundle/macOS-App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Bundle/macOS-App.entitlements   # Mac App Store apps must be sandboxed
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  XenScalePreviewExtension-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/XenScalePreviewExtension
        excludes: ["main.swift"]
      - path: Bundle/PrivacyInfo.xcprivacy
    dependencies:
      - package: XenScalePreview
        product: SclCore
    settings:
      base:
        PRODUCT_NAME: XenScalePreviewExtension
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.quicklook
        INFOPLIST_FILE: Bundle/Extension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Bundle/Extension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
